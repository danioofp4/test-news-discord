name: CABAL EU News Monitor

on:
  # Automatyczne sprawdzanie co 5 minut
  schedule:
    - cron: "*/5 * * * *"

  # Ręczne uruchomienie z opcją wysłania wiadomości testowej
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send latest CABAL news as a test message"
        required: true
        default: false
        type: boolean
     populate_last_10:
      description: "Populate Discord with the latest 10 CABAL news"
      required: true
      default: false
      type: boolean

permissions:
  contents: write

concurrency:
  group: cabal-eu-news-monitor
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check CABAL EU news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MESSAGE: ${{ inputs.test_message }}
          POPULATE_LAST_10: ${{ inputs.populate_last_10 }}
        run: python cabal_news.py

      - name: Save news state
        run: |
          if [ -z "$(git status --porcelain -- state.json)" ]; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "Update CABAL news state"
          git push
